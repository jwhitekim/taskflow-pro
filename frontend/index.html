<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .glass {
    backdrop-filter: blur(12px);
  }
</style>
</head>
<body class="bg-gradient-to-b from-slate-100 to-slate-200 dark:from-slate-900 dark:to-slate-950 min-h-screen text-slate-800 dark:text-slate-100 transition-colors">
<div class="max-w-2xl mx-auto px-4 py-6 sm:py-10">

  <header class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold tracking-tight">TaskFlow Pro</h1>
    <button id="themeToggle" class="w-10 h-10 rounded-full bg-white/70 dark:bg-white/10 glass shadow-md flex items-center justify-center text-lg">
      🌙
    </button>
  </header>

  <section class="bg-white/70 dark:bg-white/10 glass rounded-2xl shadow-lg p-4 sm:p-6 mb-6">
    <form id="taskForm" class="space-y-3">
      <input id="titleInput" type="text" placeholder="할 일 제목" required
        class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="dueAtInput" type="datetime-local"
          class="flex-1 rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <select id="statusInput"
          class="rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="todo">todo</option>
          <option value="in_progress">in_progress</option>
          <option value="done">done</option>
        </select>
      </div>
      <button type="submit"
        class="w-full rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 shadow-md transition-colors">
        추가
      </button>
    </form>
  </section>

  <section id="taskList" class="space-y-3"></section>

</div>

<div id="editModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center px-4 z-50">
  <div class="bg-white/90 dark:bg-slate-800/90 glass rounded-2xl shadow-2xl p-6 w-full max-w-md">
    <h2 class="text-lg font-semibold mb-4">할 일 수정</h2>
    <form id="editForm" class="space-y-3">
      <input type="hidden" id="editId" />
      <input id="editTitle" type="text" placeholder="제목" required
        class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <textarea id="editDescription" placeholder="설명"
        class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="editDueAt" type="datetime-local"
          class="flex-1 rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <select id="editStatus"
          class="rounded-xl border border-slate-300 dark:border-slate-600 bg-white/80 dark:bg-slate-800/80 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="todo">todo</option>
          <option value="in_progress">in_progress</option>
          <option value="done">done</option>
        </select>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 shadow-md transition-colors">저장</button>
        <button type="button" id="cancelEdit" class="flex-1 rounded-xl bg-slate-200 dark:bg-slate-700 font-medium py-2 shadow-md transition-colors">취소</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
